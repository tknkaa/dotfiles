onboarding = false

[theme]
name = "terminal"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

[keys]
prefix = "ctrl+a"

new_tab = "prefix+b"
close_tab = "prefix+x"
previous_tab = "prefix+u"
next_tab = "prefix+i"
zoom = "prefix+n"

split_vertical = "prefix+v"
split_horizontal = "prefix+s"
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"
close_pane = "prefix+d"
